stages:
  - lint
  - build
  - scan
  - deploy

variables:
  HELM_CHART_PATH: "charts/my-app"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  ARGOCD_SERVER: "argocd.example.com"
  ARGOCD_APP_NAME: "my-app-production"

# --- LINT STAGE ---
helm-lint:
  stage: lint
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  script:
    - helm lint ${HELM_CHART_PATH}
    - helm template release-test ${HELM_CHART_PATH} --dry-run

# --- BUILD STAGE ---
docker-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.20.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $IMAGE_NAME

# --- SCAN STAGE ---
trivy-fs-and-chart-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Scan Helm chart and IaC misconfigurations
    - trivy config ${HELM_CHART_PATH} --exit-code 1 --severity HIGH,CRITICAL
    # Scan application container image for vulnerabilities
    - trivy image --exit-code 1 --severity HIGH,CRITICAL ${IMAGE_NAME}

# --- DEPLOY STAGE ---
argocd-sync-trigger:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - |
      echo "Triggering ArgoCD sync for app: ${ARGOCD_APP_NAME}..."
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
        -H "Content-Type: application/json" \
        "https://${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync")
      
      if [ "$RESPONSE" -eq 200 ]; then
        echo "ArgoCD sync triggered successfully."
      else
        echo "Failed to trigger ArgoCD sync. HTTP Status: $RESPONSE"
        exit 1
      fi
  only:
    - main